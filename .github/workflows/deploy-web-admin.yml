name: Deploy web-admin to Azure Storage Static Website

on:
  # Auto-deploy only when CI passes on main. workflow_run fires after the
  # CI workflow completes regardless of outcome; the job-level `if` below
  # filters for success + main only.
  workflow_run:
    workflows: ['CI — LogiFlow Front']
    types: [completed]
    branches: [main]
  # Manual dispatch from any branch (hotfixes, first-time deploys, debugging).
  workflow_dispatch:

concurrency:
  group: deploy-web-admin
  cancel-in-progress: false

jobs:
  build_and_deploy:
    name: build & upload to $web
    runs-on: ubuntu-latest
    # When triggered by workflow_run, only proceed if CI succeeded.
    # workflow_dispatch runs are unconditional (escape hatch).
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Angular 20 requires Node 20.19+ or 22.12+.
          node-version: '20'
          cache: 'npm'
          # Workspaces share a single root lockfile.
          cache-dependency-path: package-lock.json

      - name: Install workspace dependencies
        # `npm ci` runs at the repo root — apps/web-admin has no lockfile of
        # its own, deps are hoisted via npm workspaces (apps/* + shared/*).
        run: npm ci

      - name: Build production
        working-directory: apps/web-admin
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          # Backend lives at Azure's free per-VM FQDN with nginx terminating TLS.
          # /api/v1 → gateway:3002, /socket.io → realtime:3001.
          API_URL: https://logiflow-api.eastus2.cloudapp.azure.com/api/v1
          REALTIME_URL: https://logiflow-api.eastus2.cloudapp.azure.com
          # Driver app is an Android APK, not a public web URL — left empty.
          DRIVER_APP_URL: ''
        run: npm run build -- --configuration production

      - name: Upload to Azure Storage $web container
        uses: azure/CLI@v2
        env:
          AZURE_STORAGE_ACCOUNT_NAME: ${{ secrets.AZURE_STORAGE_ACCOUNT_NAME }}
          AZURE_STORAGE_ACCOUNT_KEY:  ${{ secrets.AZURE_STORAGE_ACCOUNT_KEY }}
        with:
          azcliversion: latest
          # `upload-batch --overwrite` replaces any existing files of the same
          # name; old hashed chunks linger but don't break anything (and let
          # users with stale tabs keep working until they refresh).
          inlineScript: |
            az storage blob upload-batch \
              --account-name "$AZURE_STORAGE_ACCOUNT_NAME" \
              --account-key "$AZURE_STORAGE_ACCOUNT_KEY" \
              --auth-mode key \
              --source "apps/web-admin/www" \
              --destination '$web' \
              --overwrite

            # index.html must never be cached aggressively, or new deploys
            # don't get picked up until the browser flushes the old copy.
            az storage blob update \
              --account-name "$AZURE_STORAGE_ACCOUNT_NAME" \
              --account-key "$AZURE_STORAGE_ACCOUNT_KEY" \
              --auth-mode key \
              --container-name '$web' \
              --name 'index.html' \
              --content-cache-control 'no-cache, no-store, must-revalidate'
