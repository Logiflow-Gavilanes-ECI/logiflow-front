<div class="trip-status-panel">
  <div class="status-indicator" [ngClass]="'status-indicator--' + (currentStatus || 'idle')">
    <div class="status-dot-ring">
      <span class="status-dot-inner"></span>
    </div>
    <span class="status-indicator__label">
      {{ currentStatus ? tripStatusDisplayConstants[currentStatus].label : 'Not started' }}
    </span>
  </div>

  <div class="trip-status-actions">
    <ion-button
      expand="block"
      fill="solid"
      [color]="tripStatusDisplayConstants[tripStatusConstants.inTransit].color"
      [disabled]="isStartDisabled() || isProcessing"
      (click)="emitStart()">
      <ion-spinner *ngIf="isProcessing && pendingStatus === tripStatusConstants.inTransit" name="crescent" slot="start"></ion-spinner>
      <ion-icon *ngIf="!(isProcessing && pendingStatus === tripStatusConstants.inTransit)" slot="start" [name]="statusIconConstants.inTransit"></ion-icon>
      Start
    </ion-button>

    <ion-button
      expand="block"
      fill="solid"
      [color]="tripStatusDisplayConstants[tripStatusConstants.atStop].color"
      [disabled]="isArrivedDisabled() || isProcessing"
      (click)="emitArrived()">
      <ion-spinner *ngIf="isProcessing && pendingStatus === tripStatusConstants.atStop" name="crescent" slot="start"></ion-spinner>
      <ion-icon *ngIf="!(isProcessing && pendingStatus === tripStatusConstants.atStop)" slot="start" [name]="statusIconConstants.atStop"></ion-icon>
      Arrived
    </ion-button>

    <ion-button
      expand="block"
      fill="solid"
      [color]="tripStatusDisplayConstants[tripStatusConstants.delivered].color"
      [disabled]="isDeliveredDisabled() || isProcessing"
      (click)="emitDelivered()">
      <ion-spinner *ngIf="isProcessing && pendingStatus === tripStatusConstants.delivered" name="crescent" slot="start"></ion-spinner>
      <ion-icon *ngIf="!(isProcessing && pendingStatus === tripStatusConstants.delivered)" slot="start" [name]="statusIconConstants.completed"></ion-icon>
      Delivered
    </ion-button>
  </div>
</div>
