<ion-header>
  <ion-toolbar>
    <ion-title>
      <span class="logo-text">Logi<span class="logo-accent">Flow</span></span>
      <span class="header-separator">&mdash;</span>
      <span class="header-subtitle">Control Center</span>
    </ion-title>
    <div slot="end" class="connection-status" [class.connected]="!socketError" [class.disconnected]="socketError">
      <span class="status-dot" [class.pulse]="!socketError"></span>
      <span class="status-label">{{ socketError ? 'Disconnected' : 'Connected' }}</span>
    </div>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <div class="content-host">
    <div class="dashboard-layout">
      <aside class="sidebar">
        <app-vehicle-list (vehicleClicked)="onVehicleClicked($event)"></app-vehicle-list>
        <app-event-log></app-event-log>
      </aside>
      <main class="map-area">
        <app-map #mapRef></app-map>
      </main>
    </div>

    <div class="error-banner" *ngIf="socketError" role="alert">
      <ion-icon name="wifi-outline" class="error-banner__icon"></ion-icon>
      <span class="error-banner__text">Connection lost — data may be outdated</span>
      <button class="error-banner__btn" (click)="reconnect()">
        <ion-icon name="refresh-outline"></ion-icon>
        Reconnect
      </button>
    </div>
  </div>
</ion-content>
