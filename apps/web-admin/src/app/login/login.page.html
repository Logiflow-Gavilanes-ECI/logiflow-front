<ion-content>
  <div class="login-wrapper">
    <div class="login-card">
      <div class="login-logo">
        <span class="logo-text">Logi<span class="logo-accent">Flow</span></span>
        <span class="logo-sub">Centro de Control</span>
      </div>

      <form class="login-form" (ngSubmit)="onSubmit()">
        <div class="field">
          <label class="field__label" for="email">Correo electrónico</label>
          <input
            id="email"
            class="field__input"
            type="email"
            [(ngModel)]="email"
            name="email"
            autocomplete="email"
            placeholder="admin@logiflow.app"
            required
          />
        </div>

        <div class="field">
          <label class="field__label" for="password">Contraseña</label>
          <input
            id="password"
            class="field__input"
            type="password"
            [(ngModel)]="password"
            name="password"
            autocomplete="current-password"
            placeholder="••••••••"
            required
          />
        </div>

        <button class="login-btn" type="submit" [disabled]="isSubmitting">Ingresar</button>
      </form>
    </div>
  </div>
</ion-content>
